name: Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Read version
        id: ver
        run: echo "name=$(grep -oP 'val appVersion = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        if: env.KS_B64 != ''
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TS_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          TS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "TwinStarS-v${{ steps.ver.outputs.name }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: v${{ steps.ver.outputs.name }}
          body: ""
          files: TwinStarS-v${{ steps.ver.outputs.name }}.apk
